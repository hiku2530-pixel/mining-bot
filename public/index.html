<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LT Mining</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0d0817;
    color: #fff;
    min-height: 100vh;
    padding: 16px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: 1px; }
  .logo-icon {
    width: 32px; height: 32px; border-radius: 10px;
    background: linear-gradient(135deg, #7b2ff7, #4a90e2);
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .status {
    display: flex; align-items: center; gap: 6px;
    font-size: 10px; color: #8a8a9e; letter-spacing: 1px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #00d97e; }
  .welcome { font-size: 14px; color: #a0a0b8; margin-bottom: 4px; }
  .username { font-size: 22px; font-weight: 600; margin-bottom: 20px; }
  .username span { color: #a78bfa; }
  .balance-card {
    background: linear-gradient(135deg, #7b2ff7 0%, #5a3fd6 50%, #4a90e2 100%);
    border-radius: 24px;
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: 0 8px 32px rgba(123, 47, 247, 0.3);
  }
  .balance-label { font-size: 11px; letter-spacing: 2px; color: rgba(255,255,255,0.7); margin-bottom: 12px; }
  .balance-amount { font-size: 42px; font-weight: 700; }
  .balance-amount span { font-size: 20px; font-weight: 500; opacity: 0.8; }
  .balance-usd { font-size: 14px; color: rgba(255,255,255,0.8); margin-top: 6px; }
  .conversion {
    display: flex; justify-content: space-between;
    margin-top: 20px; padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.15);
    font-size: 12px; color: rgba(255,255,255,0.7);
  }
  .card {
    background: #1a1428;
    border-radius: 24px;
    padding: 24px;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .card-title { font-size: 11px; letter-spacing: 2px; color: #8a8a9e; }
  .badge {
    font-size: 10px; padding: 6px 12px; border-radius: 20px;
    background: rgba(167, 139, 250, 0.15); color: #a78bfa; letter-spacing: 1px;
  }
  .badge.active { background: rgba(0, 217, 126, 0.15); color: #00d97e; }
  .card h2 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .card p { font-size: 13px; color: #8a8a9e; margin-bottom: 20px; }
  .mining-info { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
  .circle {
    width: 90px; height: 90px; border-radius: 50%;
    border: 6px solid rgba(167, 139, 250, 0.2);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
  }
  .circle-progress {
    position: absolute; inset: -6px; border-radius: 50%;
    border: 6px solid transparent;
    border-top-color: #a78bfa;
  }
  .circle-percent { font-size: 20px; font-weight: 700; }
  .circle-label { font-size: 9px; color: #8a8a9e; letter-spacing: 1px; }
  .mining-details { flex: 1; }
  .rate { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  .rate span { font-size: 13px; color: #8a8a9e; font-weight: 400; }
  .timer-label { font-size: 10px; color: #8a8a9e; letter-spacing: 1px; margin-bottom: 4px; }
  .timer { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin-bottom: 6px; }
  .reward { font-size: 12px; color: #a78bfa; }
  .btn {
    width: 100%; padding: 16px; border: none; border-radius: 16px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    background: linear-gradient(135deg, #a78bfa, #7b2ff7);
    color: #fff;
    transition: opacity 0.2s;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn:active { opacity: 0.8; }
  .countdown { display: flex; gap: 10px; }
  .countdown-item {
    flex: 1; background: #241a38; border-radius: 14px; padding: 14px 8px; text-align: center;
  }
  .countdown-value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .countdown-label { font-size: 9px; color: #8a8a9e; letter-spacing: 1px; margin-top: 4px; }
  .error { background: #3a1a1a; color: #ff8888; padding: 12px; border-radius: 12px; font-size: 13px; text-align: center; }
  .loading { text-align: center; padding: 40px; color: #8a8a9e; }
</style>
</head>
<body>
  <div id="app">
    <div class="loading">Loading...</div>
  </div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const API = {
  headers: () => ({
    'Content-Type': 'application/json',
    'X-Telegram-Init-Data': tg?.initData || ''
  }),
  async get(path) {
    const r = await fetch(path, { headers: this.headers() });
    return r.json();
  },
  async post(path, body = {}) {
    const r = await fetch(path, {
      method: 'POST',
      headers: this.headers(),
      body: JSON.stringify(body)
    });
    return r.json();
  }
};

let state = { user: null, miningStartedAt: null, miningDuration: 0, miningReward: 0, listingEnd: 0 };
let timerInterval = null;

function formatNumber(n) {
  return n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function formatCountdown(ms) {
  if (ms < 0) ms = 0;
  const totalSec = Math.floor(ms / 1000);
  const d = Math.floor(totalSec / 86400);
  const h = Math.floor((totalSec % 86400) / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return { d, h, m, s };
}

function pad(n) { return String(n).padStart(2, '0'); }

function render() {
  const u = state.user;
  if (!u) {
    document.getElementById('app').innerHTML = '<div class="error">Open this Mini App from the Telegram bot.</div>';
    return;
  }

  const miningActive = !!state.miningStartedAt;
  const elapsed = miningActive ? Date.now() - state.miningStartedAt : 0;
  const progress = miningActive ? Math.min(elapsed / state.miningDuration, 1) : 0;
  const remaining = miningActive ? Math.max(state.miningDuration - elapsed, 0) : state.miningDuration;
  const canClaim = miningActive && remaining <= 0;

  const rem = formatCountdown(remaining);
  const listing = formatCountdown(state.listingEnd - Date.now());

  const btnLabel = !miningActive ? 'Start Mining' : (canClaim ? 'Claim 200 LT' : 'Mining...');

  document.getElementById('app').innerHTML = `
    <div class="header">
      <div class="logo">
        <div class="logo-icon">⛏</div>
        <div>LT MINING</div>
      </div>
      <div class="status"><div class="dot"></div> CONNECTED TO TELEGRAM</div>
    </div>

    <div class="welcome">Welcome back,</div>
    <div class="username"><span>${u.username || 'Miner'}</span></div>

    <div class="balance-card">
      <div class="balance-label">TOTAL BALANCE</div>
      <div class="balance-amount">${formatNumber(u.balance)} <span>LT</span></div>
      <div class="balance-usd">≈ $${(u.balance * 0.10).toFixed(2)} USD</div>
      <div class="conversion">
        <div>Conversion rate</div>
        <div>$0.10 / LT</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">MINING</div>
        <div class="badge ${miningActive ? 'active' : ''}">${miningActive ? (canClaim ? 'READY TO CLAIM' : 'CYCLE ACTIVE') : 'CYCLE IDLE'}</div>
      </div>
      <h2>${miningActive ? (canClaim ? 'Claim your reward' : 'Mining in progress') : 'Start your next cycle'}</h2>
      <p>One tap starts a new two-hour mining run.</p>

      <div class="mining-info">
        <div class="circle">
          <div class="circle-progress" style="transform: rotate(${progress * 360}deg)"></div>
          <div class="circle-percent">${Math.floor(progress * 100)}%</div>
          <div class="circle-label">COMPLETE</div>
        </div>
        <div class="mining-details">
          <div class="rate">200 LT <span>/ 2 hours</span></div>
          <div class="timer-label">CYCLE TIMER</div>
          <div class="timer">${pad(rem.h)}:${pad(rem.m)}:${pad(rem.s)}</div>
          <div class="reward">Reward · 200 LT</div>
        </div>
      </div>

      <button class="btn" id="miningBtn" ${miningActive && !canClaim ? 'disabled' : ''}>${btnLabel}</button>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">LISTING</div>
      </div>
      <h2>7-day countdown</h2>
      <p>Time until listing</p>
      <div class="countdown">
        <div class="countdown-item"><div class="countdown-value">${listing.d}</div><div class="countdown-label">DAYS</div></div>
        <div class="countdown-item"><div class="countdown-value">${pad(listing.h)}</div><div class="countdown-label">HOURS</div></div>
        <div class="countdown-item"><div class="countdown-value">${pad(listing.m)}</div><div class="countdown-label">MINUTES</div></div>
        <div class="countdown-item"><div class="countdown-value">${pad(listing.s)}</div><div class="countdown-label">SECONDS</div></div>
      </div>
    </div>
  `;

  const btn = document.getElementById('miningBtn');
  if (btn) {
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        if (canClaim) {
          const res = await API.post('/api/mining/claim');
          if (res.success) {
            state.user.balance = res.balance;
            state.miningStartedAt = null;
          }
        } else if (!miningActive) {
          const res = await API.post('/api/mining/start');
          if (res.success) {
            state.miningStartedAt = res.miningStartedAt;
          }
        }
        render();
      } catch (e) {
        btn.disabled = false;
      }
    };
  }
}

async function loadUser() {
  try {
    const data = await API.get('/api/user');
    if (data.error) {
      document.getElementById('app').innerHTML = '<div class="error">' + data.error + '</div>';
      return;
    }
    state.user = data.user;
    state.user.balance = data.balance;
    state.miningStartedAt = data.miningStartedAt;
    state.miningDuration = data.miningDuration;
    state.miningReward = data.miningReward;
    state.listingEnd = data.listingEnd;
    render();
  } catch (e) {
    document.getElementById('app').innerHTML = '<div class="error">Error loading data. Open from Telegram bot.</div>';
  }
}

setInterval(() => {
  if (state.user) render();
}, 1000);

loadUser();
</script>
</body>
</html>
